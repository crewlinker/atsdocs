name: Sync OpenAPI
# Mintlify downloads the OpenAPI document at build time and rebuilds only when the docs branch is
# pushed. A backend release changes the published specification without touching this repository,
# so nothing would rebuild the site. atsback triggers a rebuild as part of its own deploy; this
# schedule is the backstop that bounds how long the reference can lag if that call is ever skipped
# or fails, and it costs one API call a day.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: mise run deploy:trigger
        env:
          MINTLIFY_PROJECT_ID: ${{ vars.MINTLIFY_PROJECT_ID }}
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
