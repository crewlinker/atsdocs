name: Watch OpenAPI
# Mintlify downloads the OpenAPI document at build time and rebuilds only when the docs branch is
# pushed. A backend release changes the published specification without touching this repository, so
# nothing would rebuild the site and the reference would quietly describe an older API.
#
# deploy:trigger is the fix, but Mintlify's REST API needs a plan this organization does not have,
# so it skips. deploy:watch is the fallback that works without one: it compares the published site
# against the specification the backend serves and opens an issue when they disagree.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: mise run deploy:trigger
        env:
          MINTLIFY_PROJECT_ID: ${{ vars.MINTLIFY_PROJECT_ID }}
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
      - run: mise run deploy:watch
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
